<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NEXA | Criar conta</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
    <link rel="stylesheet" href="css/tema.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo">
                <h1>NEXA</h1>
                <p>Gestão inteligente para sua empresa</p>
            </div>

            <div class="form-title">

                <h2>Criar sua conta</h2>

                <p>
                    Comece a organizar sua empresa em um só lugar.
                </p>

            </div>

            <form id="formCadastro">

                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="empresa">
                        Nome da empresa
                    </label>

                    <input
                        type="text"
                        id="empresa"
                        placeholder="Digite o nome da empresa"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Mínimo de 6 caracteres"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-cadastro"
                    id="btnCadastro"
                >
                    Criar minha conta
                </button>

            </form>

            <div
                id="mensagem"
                class="mensagem"
            ></div>

            <div class="login-link">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>


    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração do Supabase -->
    <script src="js/supabase.js"></script>


    <script>

        const formCadastro =
            document.getElementById("formCadastro");

        const btnCadastro =
            document.getElementById("btnCadastro");

        const mensagem =
            document.getElementById("mensagem");


        formCadastro.addEventListener("submit", async function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome").value.trim();

            const empresa =
                document.getElementById("empresa").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const senha =
                document.getElementById("senha").value;

            const confirmarSenha =
                document.getElementById("confirmarSenha").value;


            mensagem.className = "mensagem";
            mensagem.textContent = "";


            if (senha !== confirmarSenha) {

                mensagem.className = "mensagem erro";

                mensagem.textContent =
                    "As senhas não são iguais.";

                return;
            }


            btnCadastro.disabled = true;

            btnCadastro.textContent =
                "Criando conta...";


            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: senha,

                        options: {

                            data: {

                                full_name: nome,

                                company_name: empresa

                            }

                        }

                    });


                if (error) {

                    throw error;

                }


                mensagem.className =
                    "mensagem sucesso";

                mensagem.textContent =
                    "Conta criada com sucesso! Verifique seu e-mail para confirmar o cadastro.";


                formCadastro.reset();


            } catch (error) {

                console.error(error);


                mensagem.className =
                    "mensagem erro";

                mensagem.textContent =
                    error.message ||
                    "Não foi possível criar sua conta.";


            } finally {

                btnCadastro.disabled = false;

                btnCadastro.textContent =
                    "Criar minha conta";

            }

        });

    </script>

<script src="js/tema.js"></script>
</body>

</html>
