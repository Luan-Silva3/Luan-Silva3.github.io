
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda Mais | Entrar</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="pagina-login">
        <section class="cartao-login">

            <a href="login.html" class="marca">
                <span class="marca-icone">A</span>
                <span>Agenda <strong>Mais</strong></span>
            </a>

            <div class="cabecalho-login">
                <span class="etiqueta">BEM-VINDO DE VOLTA</span>
                <h1>Entrar na sua conta</h1>
                <p>Acesse sua conta e organize seus atendimentos.</p>
            </div>

            <form id="loginForm">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="botao-entrar">
                    Entrar na minha conta
                </button>

            </form>

            <p id="mensagem" aria-live="polite"></p>

            <div class="divisor"></div>

            <p class="texto-cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Criar minha conta</a>
            </p>

            <p class="rodape">Agenda Mais · Sua rotina organizada</p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/login.js"></script>

</body>
</html>
