
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda Mais | Serviços</title>

    <link rel="stylesheet" href="css/servicos.css">
</head>
<body>

    <header class="topo">
        <div class="topo-conteudo">
            <a class="marca" href="dashboard.html">Agenda Mais</a>
            <a class="link-voltar" href="dashboard.html">
                Voltar ao painel
            </a>
        </div>
    </header>

    <main class="container">
        <section class="introducao">
            <span class="etiqueta">GERENCIAMENTO</span>
            <h1>Meus serviços</h1>
            <p>
                Cadastre seus serviços, defina os preços e informe
                quanto tempo cada atendimento leva.
            </p>
        </section>

        <section class="cartao">
            <div class="titulo-cartao">
                <h2>Novo serviço</h2>
                <p>Preencha as informações abaixo.</p>
            </div>

            <form id="servicoForm">
                <div class="campo">
                    <label for="nomeServico">Nome do serviço</label>
                    <input
                        type="text"
                        id="nomeServico"
                        placeholder="Ex.: Corte de cabelo"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricaoServico">Descrição</label>
                    <textarea
                        id="descricaoServico"
                        rows="3"
                        placeholder="Descreva brevemente o serviço"
                    ></textarea>
                </div>

                <div class="campos-duplos">
                    <div class="campo">
                        <label for="precoServico">Preço (R$)</label>
                        <input
                            type="number"
                            id="precoServico"
                            min="0"
                            step="0.01"
                            placeholder="0,00"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="duracaoServico">Duração (minutos)</label>
                        <input
                            type="number"
                            id="duracaoServico"
                            min="1"
                            step="1"
                            placeholder="30"
                            required
                        >
                    </div>
                </div>

                <button class="botao-principal" type="submit">
                    Cadastrar serviço
                </button>
            </form>

            <p id="mensagem" aria-live="polite"></p>
        </section>

        <section class="cartao secao-lista">
            <div class="titulo-cartao">
                <h2>Serviços cadastrados</h2>
                <p>Gerencie os serviços oferecidos pelo seu estabelecimento.</p>
            </div>

            <ul id="listaServicos"></ul>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/proteger-servicos.js"></script>
    <script src="js/servicos.js"></script>

</body>
</html>
