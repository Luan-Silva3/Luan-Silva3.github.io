<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Mantiqueira Drinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo"><b>⌁</b></div>
    <p class="eyebrow">MANTIQUEIRA DRINKS</p>
    <h1>Acesso administrativo</h1>
    <p class="login-subtitle">Entre para gerenciar o cardápio de drinks.</p>

    <form id="loginForm">
      <label>E-mail
        <input id="email" type="email" autocomplete="email" required placeholder="seuemail@exemplo.com">
      </label>
      <label>Senha
        <input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
      </label>
      <div id="loginError" class="login-error" hidden></div>
      <button class="primary login-button" type="submit">Entrar</button>
    </form>

    <a class="back-site" href="../index.html">← Voltar para o site</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const { createClient } = window.supabase;
    const client = createClient(
      window.MANTIQUEIRA_CONFIG.SUPABASE_URL,
      window.MANTIQUEIRA_CONFIG.SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    client.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'index.html';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;

      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Entrando...';

      const { error } = await client.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

      if (error) {
        errorBox.textContent = 'E-mail ou senha incorretos. Verifique os dados e tente novamente.';
        errorBox.hidden = false;
        button.disabled = false;
        button.textContent = 'Entrar';
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
